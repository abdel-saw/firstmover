name: Tests and frontend build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Build isolated Astropods worker image
        run: docker build -f Dockerfile.drafter -t caseweave-drafter-check .
      - name: Check worker container imports without application database dependencies
        run: docker run --rm --entrypoint python caseweave-drafter-check -c "from caseweave.drafter import app; assert app.title == 'FirstMover Astropods worker'"
