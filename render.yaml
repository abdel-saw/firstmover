services:
  - type: web
    name: firstmover
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: COOKIE_SECURE
        value: "true"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: MAX_SESSIONS
        value: "1000"
      - key: MERCHANT_ENCRYPTION_KEY
        generateValue: true
      - key: AI_TRANSPORT
        value: astropods_queue
      - key: DRAFTER_SHARED_TOKEN
        sync: false
