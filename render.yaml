services:
  - type: web
    name: firstmover
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: COOKIE_SECURE
        value: "true"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./caseweave.db
      - key: MAX_SESSIONS
        value: "1000"
      - key: ORGANIZER_PASSWORD
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: AI_TRANSPORT
        value: astropods_queue
      - key: DRAFTER_SHARED_TOKEN
        sync: false
